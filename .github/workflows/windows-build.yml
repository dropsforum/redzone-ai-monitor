name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ai.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller packaging/windows/pyinstaller.spec --clean --noconfirm

      - name: Prepare artifact
        shell: cmd
        run: |
          if not exist out mkdir out
          copy "dist\DROPS Red Zone Monitoring.exe" out\
          copy "LICENSE" out\
          if exist "WINDOWS_QUICKSTART.md" copy "WINDOWS_QUICKSTART.md" out\
          if exist "packaging\windows\BUILD_INSTRUCTIONS.md" copy "packaging\windows\BUILD_INSTRUCTIONS.md" out\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DROPS-Red-Zone-Monitoring-Windows
          path: out\*

