name: Windows x64 Preview

on:
  workflow_dispatch:
  push:
    branches: [codex/native-desktop-release]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
      YOLO_AUTOINSTALL: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned official CPU wheels
        run: |
          python -m pip install --only-binary=:all: torch==2.12.0+cpu torchvision==0.27.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPU wheels unavailable; do not substitute versions.' }
          python -m pip install --only-binary=:all: -r requirements_windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency install failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed.' }
      - name: Python unit tests offscreen
        run: python -m unittest discover -s tests/python -p 'test_*.py'
      - name: Build native onedir executable
        run: python packaging/windows/build.py
      - name: Verify frozen self-test
        timeout-minutes: 12
        run: python packaging/windows/verify_self_test.py
      - name: Archive verified payload and SHA256
        run: python packaging/windows/build.py --archive
      - name: Upload review artifacts (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: DROPS-Red-Zone-Monitoring-Windows-x64-1.2.0-rc.1
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/DROPS-Red-Zone-Monitoring-Windows-x64.zip
            dist/DROPS-Red-Zone-Monitoring-Windows-x64.zip.sha256
            dist/self-test.json
