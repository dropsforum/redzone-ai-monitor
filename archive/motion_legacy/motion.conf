#####################################################################
# Motion Detection Configuration for macOS
# Motion 5.0 accessing camera via RTSP stream
#####################################################################

# System Settings
#####################################################################

daemon off
log_file /Volumes/Data Vault/Cursor 2/Motion/logs/motion.log
log_level 6
pid_file /Volumes/Data Vault/Cursor 2/Motion/logs/motion.pid

# Camera Settings
#####################################################################

camera_name Logitech_C920
camera_id 1

# Access camera via local RTSP stream created by FFmpeg
# The start_camera_stream.sh script must be running first
netcam_url rtsp://localhost:8554/camera
netcam_params capture_rate=15,rtsp_transport=tcp

# Image settings
width 640
height 480
framerate 15

# Motion Detection Settings
#####################################################################

threshold 2500
minimum_motion_frames 2
event_gap 10
pre_capture 3
post_capture 10
emulate_motion off

# Noise filtering
noise_level 32
noise_tune on
despeckle_filter EedDl

# Light changes
lightswitch_percent 5
lightswitch_frames 5

# Output Settings
#####################################################################

target_dir /Volumes/Data Vault/Cursor 2/Motion/captures

# Pictures
picture_output on
picture_output_motion off
picture_quality 85
picture_filename %Y%m%d_%H%M%S-%v-%q

# Movies  
movie_output on
movie_output_motion off
movie_filename %Y%m%d_%H%M%S-%v
movie_container mp4
movie_max_time 60
movie_quality 75

# Web Interface Settings
#####################################################################

webcontrol_port 8082
webcontrol_localhost off
webcontrol_html_output on
webcontrol_parms 1

# Stream
stream_port 8083
stream_localhost off
stream_quality 80
stream_maxrate 15

# Event Scripts
#####################################################################

on_event_start /Volumes/Data Vault/Cursor 2/Motion/scripts/on_event_start.sh %Y %m %d %H %M %S
on_event_end /Volumes/Data Vault/Cursor 2/Motion/scripts/on_event_end.sh %Y %m %d %H %M %S

# Text overlay
#####################################################################

text_left Motion Detected
text_right %Y-%m-%d %H:%M:%S
text_scale 2
