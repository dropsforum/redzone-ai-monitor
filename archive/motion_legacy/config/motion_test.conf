# Minimal Motion 5.0 test configuration for macOS
daemon off
log_file /Volumes/Data Vault/Cursor 2/Motion/logs/motion_test.log
log_level 8

# Camera configuration - Use netcam with v4l2 to access macOS camera via FFmpeg
# This tells Motion to use FFmpeg's AVFoundation to access the camera
netcam_url v4l2:///dev/video0
netcam_params input=8

# Image settings
width 640
height 480
framerate 15

# Output
target_dir /Volumes/Data Vault/Cursor 2/Motion/captures

# Motion detection
threshold 1500

# Web interface
webcontrol_port 8082
webcontrol_localhost off


